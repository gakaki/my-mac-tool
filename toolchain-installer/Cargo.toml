[package]
name = "toolchain-installer"
version = "0.1.0"
edition = "2024"
description = "Global macOS toolchain installer using China mirrors"
license = "MIT"
autobins = false

[dependencies]
nsh-base = "0.3"
nsh-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
plist = "1"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
] }

[lib]
name = "mac_settings_ui"
path = "src/lib.rs"

[[bin]]
name = "toolchain-installer"
path = "src/bin/toolchain-installer.rs"

[[bin]]
name = "my-mac-installer"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
