<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">我的 Mac 设置和开发工具安装</title>
  <desc id="description">A monochrome macOS app icon combining a window, terminal prompt, and green status light.</desc>
  <defs>
    <linearGradient id="background" x1="168" y1="96" x2="864" y2="936" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27272A"/>
      <stop offset="0.48" stop-color="#111113"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="screen" x1="256" y1="322" x2="768" y2="662" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202024"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <filter id="window-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="222.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="3"/>

  <g filter="url(#window-shadow)">
    <rect x="178" y="210" width="668" height="544" rx="92" fill="#FAFAFA"/>
    <rect x="178.5" y="210.5" width="667" height="543" rx="91.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1"/>
  </g>

  <circle cx="246" cy="274" r="18" fill="#D4D4D8"/>
  <circle cx="302" cy="274" r="18" fill="#A1A1AA"/>
  <circle cx="358" cy="274" r="18" fill="#71717A"/>
  <circle cx="754" cy="274" r="15" fill="#22C55E"/>

  <rect x="232" y="322" width="560" height="340" rx="58" fill="url(#screen)"/>
  <rect x="233" y="323" width="558" height="338" rx="57" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <path d="M340 414L446 492L340 570" fill="none" stroke="#FAFAFA" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="494" y="548" width="176" height="35" rx="17.5" fill="#FAFAFA"/>
  <rect x="696" y="402" width="36" height="172" rx="18" fill="#22C55E"/>

  <rect x="410" y="754" width="204" height="76" rx="38" fill="#FAFAFA"/>
  <rect x="342" y="808" width="340" height="38" rx="19" fill="#E4E4E7"/>
